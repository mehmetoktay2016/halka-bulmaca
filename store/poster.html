<!doctype html>
<!-- Google Play ekran görüntüsü çerçevesi (1080×1920): üstte tek mesajlı başlık, altta telefon içinde oyun ekranı.
     tools/store_shots.js oyunun ekranını çekip window.poster({ img, title, sub, bg, acc }) ile buraya koyar;
     başlıkta *yıldızlı* kısım vurgu rengindedir. -->
<html><head><meta charset="utf-8"><title>Mağaza görseli</title>
<link rel="stylesheet" href="../fonts/fonts.css">
<style>
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; }
  body {
    --bg: #1b2a5a; --acc: #ffc94a;
    color: #fff; font-family: "Nunito", system-ui, sans-serif; position: relative;
    background: radial-gradient(70% 45% at 50% 62%, color-mix(in srgb, var(--acc) 30%, transparent), transparent 70%),
      linear-gradient(180deg, var(--bg), #07080f 92%);
    display: flex; flex-direction: column; align-items: center;
  }
  .cap { padding: 104px 64px 0; text-align: center; position: relative; z-index: 1; }
  h1 { margin: 0; font-family: "Baloo F", "Baloo 2", sans-serif; font-weight: 800; font-size: 116px; line-height: .95; text-wrap: balance; text-shadow: 0 10px 40px rgba(0, 0, 0, .4); }
  h1 em { font-style: normal; color: var(--acc); }
  p { margin: 26px 0 0; font-size: 46px; font-weight: 800; color: rgba(255, 255, 255, .84); }
  .phone { margin-top: 64px; width: 780px; height: 1384px; border-radius: 86px; padding: 22px; box-sizing: border-box; position: relative; z-index: 1;
    background: linear-gradient(160deg, #2a2d3e, #0b0c14 40%); box-shadow: 0 50px 140px rgba(0, 0, 0, .6), 0 0 0 3px rgba(255, 255, 255, .14) inset; }
  .phone img { width: 100%; height: 100%; border-radius: 66px; display: block; object-fit: cover; object-position: top; }
  /* arkada süzülen iki halka: oyunun imzası */
  .ring { position: absolute; border-radius: 50%; border: 34px solid var(--acc); opacity: .16; }
  .ring.a { width: 520px; height: 520px; left: -200px; top: 760px; }
  .ring.b { width: 420px; height: 420px; right: -150px; top: 1240px; border-color: #fff; opacity: .08; }
</style></head>
<body>
  <i class="ring a"></i><i class="ring b"></i>
  <div class="cap"><h1 id="t"></h1><p id="s"></p></div>
  <div class="phone"><img id="img" alt=""></div>
  <script>
    window.poster = ({ img, title, sub, bg, acc }) => new Promise(done => {
      document.body.style.setProperty('--bg', bg); document.body.style.setProperty('--acc', acc);
      document.getElementById('t').innerHTML = title.replace(/\*(.+?)\*/g, '<em>$1</em>');
      document.getElementById('s').textContent = sub;
      const im = document.getElementById('img'); im.onload = done; im.src = img;
    });
  </script>
</body></html>
