<title>Zincirli İkizler Prototipi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Tek koyu görünüm, oyunun Mercan Resifi dünyası: dar sütun, üstte bölüm seçimi, ortada tahta, altta hamle ve düğmeler */
:root {
  --bg: #040f16; --panel: #0e2a36; --line: #1d4a5a; --fg: #effbff; --muted: #9cc7d2;
  --accent: #ff8a7a; --gold: #ffcf7a; --gold-ink: #3a2500;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(70% 45% at 15% 0%, rgba(255, 138, 122, .14), transparent 70%), radial-gradient(50% 35% at 100% 30%, rgba(45, 212, 191, .12), transparent 70%), linear-gradient(180deg, #0b2230, var(--bg)); background-color: var(--bg); color: var(--fg); font-family: var(--body); min-height: 100vh; }
main { max-width: 440px; margin: 0 auto; padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: grid; gap: 2px; }
.eyebrow { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.1; color: var(--accent); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 800 13px var(--body); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.tabs button.done::after { content: " ✓"; }
.tip { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; min-height: 2.9em; }
.tip b { color: var(--fg); }
.board { position: relative; width: 100%; aspect-ratio: 400 / 520; border-radius: 22px; background: rgba(0, 0, 0, .28); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count { flex: 1; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--fg); font-family: var(--display); font-size: 22px; }
.bar button { font: 800 15px var(--body); border-radius: 14px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.bar button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
.bar button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.win { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: rgba(4, 15, 22, .72); backdrop-filter: blur(3px); }
.win h2 { margin: 0; font-family: var(--display); font-size: 38px; color: var(--gold); }
.win p { margin: 0; color: var(--muted); }
.win button { justify-self: center; font: 800 16px var(--body); border-radius: 14px; padding: 10px 20px; border: 0; background: var(--gold); color: var(--gold-ink); cursor: pointer; }
.legend { display: grid; gap: 6px; font-size: 14px; color: var(--muted); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.legend b { color: var(--fg); }
</style>

<main>
  <header>
    <span class="eyebrow">Mercan Resifi · prototip</span>
    <h1>Zincirli İkizler</h1>
  </header>
  <div class="tabs" id="tabs"></div>
  <p class="tip" id="tip"></p>
  <div class="board" id="board">
    <canvas id="cv" aria-label="Oyun tahtası"></canvas>
    <div class="win" id="win" hidden>
      <h2 id="winTitle">Kusursuz!</h2>
      <p id="winText"></p>
      <button id="next" type="button">Sonraki bölüm</button>
    </div>
  </div>
  <div class="bar">
    <span class="count">Hamle <b id="moves">0</b> · en iyi <span id="par">1</span></span>
    <button id="plain" type="button" aria-pressed="false">Zincirsiz</button>
    <button id="reset" type="button">Baştan</button>
    <button id="hint" class="primary" type="button">İpucu</button>
  </div>
  <div class="legend" id="legend"></div>
</main>

<script src="../logic.js"></script>
<script>
(function () {
  'use strict';
  const Logic = window.RingLogic;
  const { TAU, DEG, GAP_HALF } = Logic;
  const W = 400, H = 520, STROKE = 13;
  // Mercan Resifi renkleri; zincirli ikizler deniz yeşili, zincir gemi zinciri gibi pirinç
  const COLORS = ['#ff8a7a', '#5b8def', '#c792ea'];
  const TWIN = '#2dd4bf', FIXED = '#5d6b7a', CHAIN = '#d8b46a';

  // R11 deneme bölümleri (çözücüyle seçildi; zincirsiz hamle sayısı parantezde)
  const G8 = [[120, 190], [210, 190], [300, 190], [120, 290], [210, 290], [300, 290], [165, 380], [255, 380]];
  const grid = (a, chain) => G8.map(([x, y], i) => ({ x, y, r: 58, a: a[i], ...(chain.includes(i) ? { chain: 1 } : {}) }));
  const A = [225, 135, 285, 105, 135, 240, 285, 240], B = [0, 45, 300, 300, 90, 15, 0, 255];
  const LEVELS = [
    { name: 'İlk zincir', tip: 'Zincirli iki halka <b>ancak birlikte</b> kurtulur: biri serbest kalınca eşini bekler.',
      rings: [{ x: 110, y: 200, r: 60, a: 200, chain: 1 }, { x: 110, y: 300, r: 56, a: 0, fixed: true }, { x: 290, y: 200, r: 60, a: 330, chain: 1 }, { x: 290, y: 300, r: 56, a: 0, fixed: true }] }, // (2)
    { name: 'Köşe taşı', tip: 'Köşedeki halka erken gidip yol açardı; zincir onu tutuyor. <b>Son hamleyi</b> ikisine birden sakla.',
      rings: grid(A, [2, 4]) }, // 5 (4)
    { name: 'Uzak eş', tip: 'Eşler tahtanın iki ucunda. Biri hazır olunca öbürünü de hazırla.',
      rings: grid(B, [0, 3]) }, // 6 (5)
    { name: 'Büyük final', tip: 'Zincirli çift en sonda dört halkalık bir zincirlemeyle birlikte uçar.',
      rings: grid(B, [0, 6]) }, // 6 (5)
  ];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = new Set();
  let S = null, plain = false;
  $('legend').innerHTML =
    '<span><b>Zincirle bağlı iki deniz yeşili halka ikizdir.</b> İkisi aynı anda serbest kalınca birlikte uçar.</span>' +
    '<span>Biri serbest kalıp eşini beklerse zincir sarı yanar ve halka eşine doğru çekilir. Bomba birini uçurursa zincir kopar.</span>' +
    '<span><b>Zincirsiz</b> düğmesi aynı bölümü zincir olmadan açar: farkı hamle sayısında gör. Gri halkalar sabittir.</span>';

  function centered(rings) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const r of rings) { x0 = Math.min(x0, r.x - r.r); x1 = Math.max(x1, r.x + r.r); y0 = Math.min(y0, r.y - r.r); y1 = Math.max(y1, r.y + r.r); }
    const dx = W / 2 - (x0 + x1) / 2, dy = H / 2 - (y0 + y1) / 2;
    return rings.map(r => ({ ...r, x: r.x + dx, y: r.y + dy }));
  }

  function load(k) {
    const rings = centered(LEVELS[k].rings).map(r => (plain ? (({ chain, ...o }) => o)(r) : r));
    const L = Logic.buildLevel({ rings });
    const sol = Logic.solve(L, L.startAngles, 0, 200000);
    S = { k, L, angles: L.startAngles.slice(), mask: 0, moves: 0, par: sol ? sol.moves : '?', busy: false,
      fly: {}, hidden: 0, drag: null, praise: null, hintRing: -1, snaps: [], side: {} };
    $('tip').innerHTML = LEVELS[k].tip + (plain ? ' <b>(zincirsiz)</b>' : '');
    $('par').textContent = S.par;
    $('moves').textContent = 0;
    $('win').hidden = true;
    $('plain').setAttribute('aria-pressed', plain);
    renderTabs();
  }

  function renderTabs() {
    $('tabs').innerHTML = LEVELS.map((l, i) =>
      `<button type="button" data-k="${i}" aria-pressed="${i === S.k}" class="${done.has(i) ? 'done' : ''}">${i + 1}. ${l.name}</button>`).join('');
    $('tabs').querySelectorAll('button').forEach(b => { b.onclick = () => load(+b.dataset.k); });
  }

  // ---- ses: zincir gerilir (metal şıngırtı), ikizler birlikte uçar (iki nota birden + zincir kopma), kurtulma ----
  let AC = null;
  const audio = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
  function tone(t, freq, len, vol, type, to) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.006); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + 0.02);
  }
  const clink = (t, n) => { for (let k = 0; k < n; k++) { const f = 2400 + Math.random() * 1600; tone(t + k * 0.045, f, 0.09, 0.03, 'square'); tone(t + k * 0.045, f * 1.5, 0.12, 0.02); } };
  const sound = {
    taut() { try { clink(audio().currentTime, 3); } catch (e) { /* sessiz */ } },
    twins() {
      try {
        const t = audio().currentTime;
        clink(t, 6);
        for (const f of [659.25, 830.6]) { tone(t + 0.08, f, 0.6, 0.08, 'triangle'); tone(t + 0.08, f * 2, 0.3, 0.02); }
      } catch (e) { /* sessiz */ }
    },
    free(n) { try { const t = audio().currentTime; for (let k = 0; k < Math.min(n, 5); k++) tone(t + k * 0.06, 523.25 * Math.pow(2, [0, 4, 7, 12, 16][k] / 12), 0.3, 0.12); } catch (e) { /* sessiz */ } },
  };

  // ---- çizim ----
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientWidth * H / W * dpr);
  }
  const present = i => !(S.hidden & (1 << i));
  const live = i => present(i) && !S.fly[i];
  const colorOf = i => (S.L.chainMate[i] >= 0 ? TWIN : S.L.rings[i].fixed ? FIXED : COLORS[i % COLORS.length]);
  // Serbest olup eşini bekleyen zincirli halka (zincir sarı yanar, halka eşine doğru çekilir)
  const waiting = i => S.L.chainMate[i] >= 0 && live(i) && !S.busy && !S.drag && Logic.isFree(S.L, i, S.angles, S.mask);

  function pose(i, now) {
    const r = S.L.rings[i], f = S.fly[i];
    let x = r.x, y = r.y;
    const m = S.L.chainMate[i];
    if (m >= 0 && waiting(i) && live(m)) {
      // eşine doğru hafif çekiliş
      const M = S.L.rings[m], d = Math.hypot(M.x - r.x, M.y - r.y) || 1, pull = REDUCED ? 3 : 3 + 2 * Math.sin(now / 160);
      x += (M.x - r.x) / d * pull; y += (M.y - r.y) / d * pull;
    }
    if (!f) return { x, y, alpha: 1, grow: 1 };
    const t = Math.min(Math.max((now - f.t0) / f.ms, 0), 1), e = t * t;
    return { x: x + f.dx * f.dist * e, y: y + f.dy * f.dist * e, alpha: 1 - t, grow: 1 + 0.18 * t };
  }
  function arcs(ring, angle, x, y, color, width) {
    const gaps = ring.gaps.map(g => Logic.norm(angle + g)).sort((a, b) => a - b);
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    for (let k = 0; k < gaps.length; k++) {
      ctx.beginPath(); ctx.arc(x, y, ring.r, gaps[k] + GAP_HALF, (k + 1 < gaps.length ? gaps[k + 1] : gaps[0] + TAU) - GAP_HALF); ctx.stroke();
    }
  }

  // Zincirin yanı: iki halkanın yan tarafından (üst üste binen kısımdan uzakta) bağlanır, boş tarafa sarkar.
  // Yan, ortası öbür halkalardan daha uzak düşen taraftır (bölüm başında bir kez seçilir)
  function chainSide(a, b) {
    const key = a + ':' + b;
    if (S.side[key]) return S.side[key];
    const A = S.L.rings[a], B = S.L.rings[b], d = Math.hypot(B.x - A.x, B.y - A.y) || 1;
    const nx = -(B.y - A.y) / d, ny = (B.x - A.x) / d, mx = (A.x + B.x) / 2, my = (A.y + B.y) / 2, off = (A.r + B.r) / 2 + 24;
    const room = s => Math.min(...S.L.rings.map((r, i) => (i === a || i === b ? Infinity : Math.abs(Math.hypot(mx + nx * s * off - r.x, my + ny * s * off - r.y) - r.r))));
    return (S.side[key] = room(1) >= room(-1) ? 1 : -1);
  }
  // Zincir: iki halkanın yanından sarkan baklalar; eş beklerken gerilir ve sarı yanar
  function drawChain(a, b, now) {
    const A = pose(a, now), B = pose(b, now), Ra = S.L.rings[a], Rb = S.L.rings[b];
    const d = Math.hypot(B.x - A.x, B.y - A.y) || 1, ux = (B.x - A.x) / d, uy = (B.y - A.y) / d, s = chainSide(a, b);
    const nx = -uy * s, ny = ux * s, c = 0.5, sn = Math.sqrt(1 - c * c);
    const x0 = A.x + (ux * c + nx * sn) * Ra.r, y0 = A.y + (uy * c + ny * sn) * Ra.r;
    const x1 = B.x + (-ux * c + nx * sn) * Rb.r, y1 = B.y + (-uy * c + ny * sn) * Rb.r;
    const span = Math.hypot(x1 - x0, y1 - y0);
    const taut = waiting(a) || waiting(b);
    const sag = taut ? 6 : Math.min(36, 12 + span * 0.15);
    const n = Math.max(3, Math.round(span / 13));
    // sarkma boş tarafa doğru
    const at = u => [(1 - u) * x0 + u * x1 + nx * 4 * sag * u * (1 - u), (1 - u) * y0 + u * y1 + ny * 4 * sag * u * (1 - u)];
    ctx.save();
    ctx.globalAlpha = Math.min(A.alpha, B.alpha);
    const glow = taut ? 0.6 + 0.4 * Math.sin(now / 140) : 0;
    for (let k = 0; k < n; k++) {
      const [px, py] = at((k + 0.5) / n), [qx, qy] = at((k + 1) / n), ang = Math.atan2(qy - py, qx - px);
      ctx.save(); ctx.translate(px, py); ctx.rotate(ang + (k % 2 ? Math.PI / 2 : 0) * 0);
      ctx.strokeStyle = 'rgba(4,15,22,.75)'; ctx.lineWidth = 5.5;
      ctx.beginPath(); ctx.ellipse(0, 0, 6.5, k % 2 ? 2.2 : 3.6, 0, 0, TAU); ctx.stroke();
      ctx.strokeStyle = taut ? `rgb(255,${210 + 30 * glow},${110 + 60 * glow})` : CHAIN; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.ellipse(0, 0, 6.5, k % 2 ? 2.2 : 3.6, 0, 0, TAU); ctx.stroke();
      ctx.restore();
    }
    // uçlarda halkaya takılı kelepçe
    for (const [x, y] of [[x0, y0], [x1, y1]]) {
      ctx.fillStyle = 'rgba(4,15,22,.8)'; ctx.beginPath(); ctx.arc(x, y, 6, 0, TAU); ctx.fill();
      ctx.fillStyle = taut ? '#ffe9a8' : CHAIN; ctx.beginPath(); ctx.arc(x, y, 4, 0, TAU); ctx.fill();
    }
    ctx.restore();
  }

  function draw(now) {
    const dpr = cv.width / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = S.L;
    for (const link of L.links) {
      if (!live(link.a) || !live(link.b)) continue;
      for (const p of link.pts) {
        if (!Logic.pointOpen(L, link, p, S.angles)) continue;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
        g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, TAU); ctx.fill();
      }
    }
    for (let i = 0; i < L.rings.length; i++) {
      if (!present(i)) continue;
      const r = L.rings[i], P = pose(i, now), color = colorOf(i), ang = S.angles[i];
      ctx.save();
      ctx.globalAlpha = P.alpha;
      ctx.translate(P.x, P.y); ctx.scale(P.grow, P.grow); ctx.translate(-P.x, -P.y);
      const active = (S.drag && S.drag.ring === i) || S.hintRing === i || waiting(i);
      arcs(r, ang, P.x + 2, P.y + 4, 'rgba(0,0,0,.42)', STROKE + 6);
      if (active) { ctx.shadowColor = waiting(i) ? '#ffe9a8' : color; ctx.shadowBlur = 20; }
      arcs(r, ang, P.x, P.y, color, STROKE);
      ctx.shadowBlur = 0;
      arcs(r, ang, P.x - 1.2, P.y - 1.6, 'rgba(255,255,255,.28)', 3);
      ctx.restore();
    }
    // zincirler halkaların üstünde (eşlerden biri gidince kopmuş sayılır)
    L.chainMate.forEach((m, i) => { if (m > i && present(i) && present(m) && !(S.fly[i] && S.fly[i].alone) && !(S.fly[m] && S.fly[m].alone)) drawChain(i, m, now); });
    // kopan zincirin baklaları saçılır
    S.snaps = S.snaps.filter(s => now - s.t0 < 800);
    for (const s of S.snaps) {
      const t = (now - s.t0) / 800;
      ctx.save(); ctx.globalAlpha = 1 - t; ctx.strokeStyle = CHAIN; ctx.lineWidth = 2.6;
      for (const b of s.bits) {
        ctx.save(); ctx.translate(s.x + b.vx * t * 90, s.y + b.vy * t * 90 + 120 * t * t); ctx.rotate(b.r + t * 6);
        ctx.beginPath(); ctx.ellipse(0, 0, 6.5, 3.4, 0, 0, TAU); ctx.stroke(); ctx.restore();
      }
      ctx.restore();
    }
    if (S.praise) {
      const t = (now - S.praise.t0) / 1400;
      if (t >= 1) S.praise = null;
      else {
        ctx.save();
        ctx.globalAlpha = t < .12 ? t / .12 : 1 - Math.max(0, (t - .6) / .4);
        ctx.font = '800 44px "Baloo 2", "Nunito", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(4,15,22,.85)'; ctx.lineJoin = 'round';
        ctx.translate(W / 2, 72 - 14 * t);
        ctx.strokeText(S.praise.text, 0, 0);
        ctx.fillStyle = S.praise.color || '#ffcf7a'; ctx.fillText(S.praise.text, 0, 0);
        ctx.restore();
      }
    }
    requestAnimationFrame(draw);
  }

  // ---- hareket ----
  const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
  function tween(from, to, ms) {
    return new Promise(res => {
      const t0 = performance.now();
      const step = () => {
        const t = REDUCED ? 1 : Math.min((performance.now() - t0) / ms, 1), e = 1 - Math.pow(1 - t, 3);
        S.angles = from.map((a, i) => a + Logic.signedDelta(a, to[i]) * e);
        if (t < 1) requestAnimationFrame(step); else { S.angles = to.slice(); res(); }
      };
      step();
    });
  }
  function launch(i, now, toward) {
    const r = S.L.rings[i];
    let dx = r.x - W / 2, dy = r.y - H / 2;
    // ikizler aynı yöne, ikisinin ortasından dışarı uçar
    if (toward) { dx = toward.x - W / 2; dy = toward.y - H / 2; }
    const d = Math.hypot(dx, dy) || 1;
    S.fly[i] = { t0: now, dx: dx / d, dy: dy / d - .25, ms: 560, dist: 460, alone: !toward && S.L.chainMate[i] >= 0 };
  }

  async function settle() {
    const L = S.L, st = S;
    const c = Logic.cascade(L, S.angles, S.mask);
    if (!c.waves.length) {
      // serbest olup eşini bekleyen varsa zincir gerilir
      if (L.chainMate.some((m, i) => waiting(i))) sound.taut();
      return;
    }
    S.busy = true;
    let freed = 0, twins = 0;
    for (const wave of c.waves) {
      const now = performance.now();
      for (const i of wave) {
        const m = L.chainMate[i];
        const pair = m >= 0 && wave.includes(m);
        if (pair && m < i) continue;
        if (pair) {
          const A = L.rings[i], B = L.rings[m], mid = { x: (A.x + B.x) / 2, y: (A.y + B.y) / 2 };
          launch(i, now, mid); launch(m, now, mid); freed += 2; twins++;
          sound.twins();
          continue;
        }
        if (m >= 0 && !(S.mask & (1 << m)) && present(m)) {
          // eşi kalırken zorla uçan zincirli: zincir kopar
          const A = L.rings[i], B = L.rings[m];
          S.snaps.push({ x: (A.x + B.x) / 2, y: (A.y + B.y) / 2, t0: now, bits: Array.from({ length: 8 }, () => ({ vx: Math.random() * 2 - 1, vy: -Math.random(), r: Math.random() * 6 })) });
        }
        launch(i, now); freed++;
      }
      for (const i of wave) S.mask |= 1 << i;
      await sleep(220); if (S !== st) return;
    }
    sound.free(freed);
    await sleep(560); if (S !== st) return;
    for (const i of Object.keys(S.fly)) { S.hidden |= 1 << i; delete S.fly[i]; }
    S.mask = c.mask;
    const now = performance.now();
    if (twins) S.praise = { text: 'İkizler birlikte!', color: TWIN, t0: now };
    else if (freed >= 2) S.praise = { text: freed >= 4 ? 'Muhteşem!' : freed === 3 ? 'Harika!' : 'Süper!', t0: now };
    S.busy = false;
    if (S.mask === L.full) win();
  }

  function win() {
    done.add(S.k);
    renderTabs();
    const perfect = S.moves <= S.par;
    $('winTitle').textContent = perfect ? 'Kusursuz!' : 'Bitti!';
    $('winText').textContent = perfect ? `${S.moves} hamle, en iyi çözüm.` : `${S.moves} hamle. En iyi çözüm ${S.par} hamle.`;
    $('next').textContent = S.k + 1 < LEVELS.length ? 'Sonraki bölüm' : 'Baştan oyna';
    const k = S.k;
    setTimeout(() => { if (S.k === k && S.mask === S.L.full) $('win').hidden = false; }, 900);
  }

  function snap(i) {
    const L = S.L, ring = L.rings[i];
    let best = null, bd = 14 * DEG;
    for (const li of L.ringLinks[i]) {
      const k = L.links[li], o = k.a === i ? k.b : k.a;
      if (S.mask & (1 << o)) continue;
      for (const p of k.pts) {
        const ang = k.a === i ? p.angA : p.angB;
        for (const g of ring.gaps) {
          const t = Logic.norm(ang - g), d = Logic.angDist(t, S.angles[i]);
          if (d < bd) { bd = d; best = t; }
        }
      }
    }
    if (best != null) S.angles = Logic.rotate(L, S.angles, i, Logic.signedDelta(S.angles[i], best));
  }
  function commit() { S.moves++; $('moves').textContent = S.moves; settle(); }

  const toBoard = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height }; };
  cv.addEventListener('pointerdown', e => {
    if (S.busy || !$('win').hidden) return;
    const p = toBoard(e);
    let pick = -1, bd = 26;
    S.L.rings.forEach((r, i) => {
      if (S.mask & (1 << i)) return;
      const d = Math.abs(Math.hypot(p.x - r.x, p.y - r.y) - r.r);
      if (d < bd) { bd = d; pick = i; }
    });
    if (pick < 0 || S.L.rings[pick].fixed) return;
    const r = S.L.rings[pick];
    S.drag = { ring: pick, last: Math.atan2(p.y - r.y, p.x - r.x), total: 0, base: S.angles.slice() };
    S.hintRing = -1;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!S.drag) return;
    const p = toBoard(e), D = S.drag, r = S.L.rings[D.ring];
    const a = Math.atan2(p.y - r.y, p.x - r.x);
    D.total += Logic.signedDelta(D.last, a); D.last = a;
    S.angles = Logic.rotate(S.L, D.base, D.ring, D.total);
  });
  const release = () => {
    if (!S.drag) return;
    const D = S.drag; S.drag = null;
    if (Math.abs(D.total) < 3 * DEG) { S.angles = D.base; return; }
    snap(D.ring);
    commit();
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  $('reset').onclick = () => { if (!S.busy) load(S.k); };
  $('plain').onclick = () => { if (S.busy) return; plain = !plain; load(S.k); };
  $('next').onclick = () => load((S.k + 1) % LEVELS.length);
  $('hint').onclick = async () => {
    if (S.busy || S.mask === S.L.full) return;
    const sol = Logic.solve(S.L, S.angles, S.mask, 200000);
    if (!sol || !sol.first) return;
    S.busy = true; S.hintRing = sol.first.ring;
    await tween(S.angles, Logic.rotate(S.L, S.angles, sol.first.ring, sol.first.delta), 650);
    S.hintRing = -1; S.busy = false;
    commit();
  };

  new ResizeObserver(resize).observe(cv);
  resize();
  load(0);
  requestAnimationFrame(draw);
  window.__proto = { get S() { return S; }, load, hint: () => $('hint').onclick(), setPlain: v => { plain = v; load(S.k); } };
})();
</script>
