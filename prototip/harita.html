<title>Macera Haritası</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Tek koyu görünüm (oyunun gece haritası). Dar sütun: üstte dünya bilgisi ve yıldız sayacı, ortada harita, altta düğmeler */
:root {
  --bg: #0b0814; --panel: #1b1528; --line: #33284a; --fg: #fff4ec; --muted: #c9b8d6;
  --gold: #ffc94a; --gold-ink: #3d2a00;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); }
main { max-width: 440px; height: 100%; margin: 0 auto; padding-block: 12px 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 10px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.world { display: grid; }
.eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-size: 25px; line-height: 1.1; transition: color .6s; }
.stars { display: flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; background: var(--panel); border: 1px solid var(--line); font-weight: 900; font-variant-numeric: tabular-nums; }
.stars i { width: 18px; height: 18px; background: var(--gold); clip-path: polygon(50% 0, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%); filter: drop-shadow(0 0 4px #ffc94a); }
.stars.bump { animation: bump .35s ease; }
@keyframes bump { 40% { transform: scale(1.18); } }
.map { position: relative; flex: 1; min-height: 360px; border-radius: 22px; overflow: hidden; border: 1px solid var(--line); touch-action: none; }
.map.shake { animation: shake .5s ease; }
@keyframes shake { 20% { transform: translate(-4px, 2px); } 40% { transform: translate(4px, -2px); } 60% { transform: translate(-3px, -1px); } 80% { transform: translate(2px, 1px); } }
canvas { display: block; width: 100%; height: 100%; cursor: grab; }
.bar { display: flex; gap: 10px; }
button { font: 800 16px var(--body); border-radius: 16px; padding: 12px 16px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
button.primary { flex: 1; background: linear-gradient(180deg, #ffe07a, var(--gold)); color: var(--gold-ink); border-color: #d9a32a; box-shadow: 0 4px 0 #a8750f; }
button.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 #a8750f; }
button:disabled { opacity: .5; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
.note { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.45; }
@media (prefers-reduced-motion: reduce) { .map.shake, .stars.bump { animation: none; } }
</style>

<main>
  <header>
    <div class="world"><span class="eyebrow" id="gateLbl">Kapı 31 · Barut Deposu</span><h1 id="worldLbl">Havai Fişek</h1></div>
    <div class="stars" id="starPill"><i aria-hidden="true"></i><span id="starCount">0 / 60</span></div>
  </header>
  <div class="map" id="map"><canvas id="cv" aria-label="Macera haritası: Havai Fişek festival meydanı ve Buzul"></canvas></div>
  <div class="bar">
    <button id="reset" type="button">Baştan</button>
    <button id="win" class="primary" type="button">Bölümü kazan ▶</button>
  </div>
  <p class="note">Prototip: bölümü kazandıkça halka bir sonraki kaideye zıplar, yol ışıklanır, yıldızlar sayaca uçar. Yoldaki ödüller toplanınca açılır. 10. bölümde kale kapısı açılır, Buzul'un sisi kalkar. Haritayı parmakla kaydırabilirsin.</p>
</main>

<script>
(function () {
  'use strict';
  const $ = id => document.getElementById(id);
  const cv = $('cv'), g = cv.getContext('2d');
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const TAU = Math.PI * 2;
  const W = 400, STEP = 124, N = 20;
  const MAP_H = 20 * STEP + 860;
  const yOf = i => MAP_H - 180 - i * STEP - (i >= 10 ? 340 : 0);
  const NODES = Array.from({ length: N }, (_, i) => ({ x: W / 2 + Math.sin(i * 0.95 + 0.4) * 108, y: yOf(i) }));
  const GATE_Y = yOf(9) - 170;   // kalenin kapısının alt çizgisi
  const SPLIT = GATE_Y - 150;    // iki dünyanın sınırı (kalenin arkası)
  const WORLDS = [
    { name: 'Havai Fişek', gate: 'Kapı 31 · Barut Deposu', accent: '#ff8a4c', glow: '#ffd36b' },
    { name: 'Buzul', gate: 'Kapı 34 · Kar Tepesi', accent: '#7fe3ff', glow: '#e8fbff' },
  ];
  const REWARDS = { 3: 'chest', 6: 'mystery', 8: 'piece', 13: 'chest', 16: 'mystery' };
  const STARS = [3, 3, 2, 3, 3, 1, 3, 2, 3, 3, 3, 2, 3, 3, 3, 3, 2, 3, 3, 3];
  const rng = seed => { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) >>> 0; let t = a; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; };

  // ---- yol eğrisi ----
  function pathPoint(t) {
    const i = Math.max(0, Math.min(N - 2, Math.floor(t))), f = t - i;
    const p0 = NODES[Math.max(0, i - 1)], p1 = NODES[i], p2 = NODES[i + 1], p3 = NODES[Math.min(N - 1, i + 2)];
    const c = (a, b, c2, d) => 0.5 * (2 * b + (-a + c2) * f + (2 * a - 5 * b + 4 * c2 - d) * f * f + (-a + 3 * b - 3 * c2 + d) * f * f * f);
    return { x: c(p0.x, p1.x, p2.x, p3.x), y: c(p0.y, p1.y, p2.y, p3.y) };
  }
  // Yol taşları: eğri boyunca eşit aralıklı, her biri yolun yönüne dönük
  const STONES = [];
  (function () {
    let prev = pathPoint(0), acc = 0;
    for (let t = 0; t <= N - 1; t += 0.01) {
      const p = pathPoint(t), d = Math.hypot(p.x - prev.x, p.y - prev.y);
      acc += d;
      if (acc >= 19) { acc = 0; const q = pathPoint(Math.min(N - 1, t + 0.01)); STONES.push({ x: p.x, y: p.y, a: Math.atan2(q.y - p.y, q.x - p.x), t, s: 0.85 + ((t * 977) % 1) * 0.3 }); }
      prev = p;
    }
  })();

  // ---- istasyonlar: her durağın yolun dış tarafında kendine özgü bir yapısı ve adı var ----
  const STATION_DEFS = [
    ['lanternStall', 'Fener Tezgâhı'], ['rocket', 'Roket Rampası'], ['cannon', 'Konfeti Topu'], ['balloonStand', 'Balon Standı'],
    ['parrot', 'Papağan Sahnesi'], ['drumStage', 'Davul Sahnesi'], ['sparkTent', 'Maytap Çadırı'], ['barrel', 'Barut Fıçısı'],
    ['wheel', 'Dönme Dolap'], ['arena', 'Dev Davul Arenası'],
    ['igloo', 'İglo'], ['snowman', 'Kardan Adam Bahçesi'], ['penguins', 'Penguen Yuvası'], ['rink', 'Buz Pateni Gölü'],
    ['bearCave', 'Kutup Ayısı Mağarası'], ['sled', 'Kızak Rampası'], ['crystal', 'Kristal Mağara'], ['seal', 'Fok Kayası'],
    ['tower', 'Kuzey Işığı Kulesi'], ['palace', 'Buz Sarayı'],
  ];
  const STATIONS = NODES.map((n, i) => {
    const side = n.x > W / 2 ? 1 : -1;
    return { i, x: Math.max(36, Math.min(W - 36, n.x + side * 58)), y: n.y - 4, kind: STATION_DEFS[i][0], name: STATION_DEFS[i][1] };
  });

  // Her istasyon, Halka'yı bir sonrakine kendi nesnesiyle taşır
  const TRAVEL = { lanternStall: 'lantern', rocket: 'rocket', cannon: 'cannon', balloonStand: 'balloon', parrot: 'bird', drumStage: 'bounce',
    sparkTent: 'rocket', barrel: 'cannon', wheel: 'wheel', igloo: 'slide', snowman: 'snowball', penguins: 'slide', rink: 'skate',
    bearCave: 'snowball', sled: 'sled', crystal: 'teleport', seal: 'bounce', tower: 'lantern' };
  const TRAVEL_MS = { lantern: 1500, balloon: 1500, rocket: 950, cannon: 800, bounce: 1100, bird: 1300, wheel: 1100, slide: 1000, skate: 1000, sled: 1000, snowball: 1300, teleport: 900 };
  const PATH_MODES = new Set(['wheel', 'slide', 'skate', 'sled', 'snowball']);

  // ---- dekor yerleşimi (tohumlu, yolun iki yanında, yola ve istasyonlara değmeyen yerlerde) ----
  const nearPath = (x, y, m) => { for (const s of STONES) if (Math.abs(s.y - y) < m && Math.hypot(s.x - x, s.y - y) < m) return true; return STATIONS.some(s => Math.hypot(s.x - x, s.y - y) < m + 6); };
  const DECOR = [];
  (function () {
    const R = rng(31);
    const kinds = ['tent', 'tent', 'lamp', 'stall', 'balloons', 'lamp', 'tent', 'carousel'];
    for (let k = 0; k < 160 && DECOR.length < 34; k++) {
      const y = SPLIT + 120 + R() * (MAP_H - SPLIT - 160), x = 24 + R() * (W - 48);
      if (nearPath(x, y, 70) || Math.abs(y - GATE_Y) < 170) continue;
      if (DECOR.some(d => Math.hypot(d.x - x, d.y - y) < 74)) continue;
      DECOR.push({ w: 0, kind: kinds[DECOR.length % kinds.length], x, y, c: ['#ff6b6b', '#ffc94a', '#b388ff', '#2dd4bf', '#ff8fab'][Math.floor(R() * 5)], ph: R() * TAU });
    }
    const R2 = rng(77);
    for (let k = 0; k < 200 && DECOR.filter(d => d.w).length < 30; k++) {
      const y = 40 + R2() * (SPLIT - 80), x = 24 + R2() * (W - 48);
      if (nearPath(x, y, 64)) continue;
      if (DECOR.some(d => d.w && Math.hypot(d.x - x, d.y - y) < 60)) continue;
      DECOR.push({ w: 1, kind: R2() < 0.62 ? 'pine' : R2() < 0.6 ? 'ice' : 'lake', x, y, s: 0.8 + R2() * 0.5, ph: R2() * TAU });
    }
    DECOR.sort((a, b) => a.y - b.y);
  })();

  let S;
  function reset() {
    S = { done: 0, hop: null, land: null, gateOpen: 0, gateT: 0, fog: 1, fogT: 0, camY: 0, camTarget: 0, drag: null, follow: true,
      fx: [], fireworks: [], flyStars: [], collected: {}, opened: {}, shownStars: 0, trail: [], cheer: 0, cheerStar: false };
    S.camTarget = clampCam(NODES[0].y - viewH() * 0.62); S.camY = S.camTarget;
    $('win').disabled = false; $('win').textContent = 'Bölümü kazan ▶';
    updateHud();
  }
  const viewH = () => cv.clientHeight * (W / cv.clientWidth);
  const clampCam = y => Math.max(0, Math.min(MAP_H - viewH(), y));
  function updateHud() {
    const w = S.done >= 10 ? 1 : 0;
    $('worldLbl').textContent = WORLDS[w].name; $('worldLbl').style.color = WORLDS[w].accent;
    $('gateLbl').textContent = WORLDS[w].gate;
    $('starCount').textContent = `${S.shownStars} / 60`;
  }
  function bumpStars() { const el = $('starPill'); el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

  // ---- ses ----
  let AC = null;
  function tone(f, dur, type = 'sine', vol = 0.08, to = 0, delay = 0) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const t = AC.currentTime + delay, o = AC.createOscillator(), gn = AC.createGain();
      o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
      gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(vol, t + 0.01); gn.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      o.connect(gn).connect(AC.destination); o.start(t); o.stop(t + dur + 0.02);
    } catch (e) { /* ses yoksa sessiz */ }
  }
  function noise(dur, vol, from, to, delay = 0) {
    try {
      AC = AC || new (window.AudioContext || window.webkitAudioContext)();
      const t = AC.currentTime + delay, buf = AC.createBuffer(1, Math.floor(AC.sampleRate * dur), AC.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
      const n = AC.createBufferSource(); n.buffer = buf; const f = AC.createBiquadFilter(); f.type = 'lowpass';
      f.frequency.setValueAtTime(from, t); f.frequency.exponentialRampToValueAtTime(to, t + dur);
      const gn = AC.createGain(); gn.gain.value = vol; n.connect(f).connect(gn).connect(AC.destination); n.start(t);
    } catch (e) { /* ses yoksa sessiz */ }
  }
  const sfx = {
    hop: () => { tone(440, 0.22, 'triangle', 0.08, 880); },
    land: () => { tone(160, 0.12, 'sine', 0.12, 90); tone(1320, 0.18, 'sine', 0.035, 0, 0.02); },
    star: k => tone([1047, 1319, 1568][k] || 1568, 0.22, 'triangle', 0.06),
    chest: () => { noise(0.25, 0.25, 3000, 400); [784, 988, 1175, 1568, 2093].forEach((f, k) => tone(f, 0.3, 'triangle', 0.06, 0, 0.15 + k * 0.06)); },
    coin: k => tone(1800 + k * 120, 0.08, 'square', 0.025),
    boom: () => { noise(0.6, 0.35, 2200, 140); tone(90, 0.4, 'sine', 0.2, 40); },
    fanfare: () => [523, 659, 784, 1047, 1319].forEach((f, k) => tone(f, 0.6, 'triangle', 0.07, 0, 0.1 + k * 0.1)),
    wind: () => { noise(1.6, 0.2, 600, 2400); tone(320, 1.4, 'sine', 0.03, 900); },
  };

  // =================== ÇİZİM ===================
  const add = fn => { g.save(); g.globalCompositeOperation = 'lighter'; fn(); g.restore(); };
  function glow(x, y, r, color, a = 1) { const gr = g.createRadialGradient(x, y, 0, x, y, r); gr.addColorStop(0, color); gr.addColorStop(1, 'rgba(0,0,0,0)'); g.globalAlpha = a; g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, TAU); g.fill(); g.globalAlpha = 1; }

  // ---- zemin ----
  function groundFisek(top, bot, now) {
    const gr = g.createLinearGradient(0, top, 0, bot);
    gr.addColorStop(0, '#2b1036'); gr.addColorStop(0.5, '#3a1430'); gr.addColorStop(1, '#241024');
    g.fillStyle = gr; g.fillRect(0, top, W, bot - top);
    // meydan taşı deseni (yalnız görünen kısım)
    const R = rng(5);
    g.strokeStyle = 'rgba(255,200,230,.045)'; g.lineWidth = 1;
    for (let y = Math.floor(top / 26) * 26; y < bot; y += 26) {
      const off = (y / 26) % 2 ? 0 : 20;
      g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
      for (let x = off; x < W; x += 40) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 26); g.stroke(); }
    }
    // sıcak ışık sisleri
    for (let k = 0; k < 6; k++) { const y = SPLIT + 200 + k * 420, x = (k % 2 ? 80 : 320); if (y < top - 200 || y > bot + 200) continue; glow(x, y, 230, 'rgba(255,120,80,.10)'); }
    // çimen tutamları
    for (let k = 0; k < 220; k++) { const x = R() * W, y = SPLIT + R() * (MAP_H - SPLIT); if (y < top || y > bot || nearPath(x, y, 30)) continue; g.strokeStyle = 'rgba(140,220,150,.18)'; g.lineWidth = 1.4; g.beginPath(); g.moveTo(x, y); g.lineTo(x - 2, y - 6); g.moveTo(x, y); g.lineTo(x + 2, y - 7); g.stroke(); }
  }
  function groundBuzul(top, bot, now) {
    const gr = g.createLinearGradient(0, top, 0, bot);
    gr.addColorStop(0, '#cfe9f7'); gr.addColorStop(1, '#a9d3ea');
    g.fillStyle = gr; g.fillRect(0, top, W, bot - top);
    // kar dalgaları ve gölgeler
    const R = rng(9);
    for (let k = 0; k < 40; k++) { const x = R() * W, y = R() * SPLIT; if (y < top - 80 || y > bot + 80) continue; g.fillStyle = 'rgba(120,170,210,.12)'; g.beginPath(); g.ellipse(x, y, 60 + R() * 60, 14 + R() * 10, 0, 0, TAU); g.fill(); g.fillStyle = 'rgba(255,255,255,.35)'; g.beginPath(); g.ellipse(x - 8, y - 5, 50, 8, 0, 0, TAU); g.fill(); }
    // kutup ışıkları zemine düşen yansıma
    add(() => { for (let b = 0; b < 2; b++) { const y0 = 200 + b * 520; if (y0 < top - 300 || y0 > bot + 300) continue; g.globalAlpha = 0.18; const a = g.createLinearGradient(0, y0 - 120, 0, y0 + 120); a.addColorStop(0, 'rgba(0,0,0,0)'); a.addColorStop(0.5, b ? '#b388ff' : '#59ffc8'); a.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = a; g.beginPath(); g.moveTo(0, y0 + 120); for (let x = 0; x <= W; x += 16) g.lineTo(x, y0 + Math.sin(x / 70 + now / 1800 + b) * 40); g.lineTo(W, y0 + 120); g.closePath(); g.fill(); } });
    // buz kristali parıltıları
    add(() => { const R2 = rng(13); for (let k = 0; k < 60; k++) { const x = R2() * W, y = R2() * SPLIT; if (y < top || y > bot) continue; const tw = Math.max(0, Math.sin(now / 500 + k * 1.7)); if (tw < 0.6) continue; g.fillStyle = `rgba(255,255,255,${tw})`; sparkle(x, y, 3 + tw * 3); } });
  }
  function sparkle(x, y, s) { g.beginPath(); g.moveTo(x, y - s); g.lineTo(x + s * 0.25, y - s * 0.25); g.lineTo(x + s, y); g.lineTo(x + s * 0.25, y + s * 0.25); g.lineTo(x, y + s); g.lineTo(x - s * 0.25, y + s * 0.25); g.lineTo(x - s, y); g.lineTo(x - s * 0.25, y - s * 0.25); g.closePath(); g.fill(); }

  // ---- dekor: Havai Fişek ----
  function shadow(x, y, rx, ry, a = 0.45) { g.fillStyle = `rgba(10,4,16,${a})`; g.beginPath(); g.ellipse(x, y, rx, ry, 0, 0, TAU); g.fill(); }
  function tent(d, now) {
    const { x, y, c } = d;
    shadow(x + 6, y + 30, 40, 9);
    g.save(); g.translate(x, y);
    // çizgili koni çadır (iki ton, kenar ışığı)
    for (let k = -3; k < 3; k++) {
      g.fillStyle = k % 2 ? c : '#fff5ea';
      g.beginPath(); g.moveTo(0, -34); g.lineTo(k * 11, 28); g.lineTo((k + 1) * 11, 28); g.closePath(); g.fill();
    }
    g.fillStyle = 'rgba(0,0,0,.22)'; g.beginPath(); g.moveTo(0, -34); g.lineTo(0, 28); g.lineTo(33, 28); g.closePath(); g.fill();
    g.fillStyle = '#3a1430'; g.beginPath(); g.moveTo(-9, 28); g.quadraticCurveTo(0, 6, 9, 28); g.fill();
    add(() => glow(0, 22, 18, 'rgba(255,200,120,.55)'));
    g.strokeStyle = '#fff'; g.lineWidth = 1.6; g.beginPath(); g.moveTo(0, -34); g.lineTo(0, -48); g.stroke();
    const wave = REDUCED ? 0 : Math.sin(now / 240 + d.ph) * 3;
    g.fillStyle = c; g.beginPath(); g.moveTo(0, -48); g.quadraticCurveTo(8, -46 + wave, 15, -44 + wave); g.lineTo(0, -40); g.fill();
    g.restore();
  }
  function lamp(d, now) {
    const { x, y } = d, fl = REDUCED ? 1 : 0.85 + 0.15 * Math.sin(now / 90 + d.ph) * Math.sin(now / 137);
    add(() => glow(x, y + 14, 70 * fl, 'rgba(255,190,110,.32)'));
    shadow(x + 3, y + 18, 9, 3);
    g.fillStyle = '#1e1028'; g.fillRect(x - 2, y - 30, 4, 48);
    g.fillStyle = '#2a1636'; g.fillRect(x - 7, y + 14, 14, 4);
    g.fillStyle = '#ffe2a8'; g.beginPath(); g.arc(x, y - 34, 6, 0, TAU); g.fill();
    add(() => glow(x, y - 34, 22 * fl, 'rgba(255,220,150,.9)'));
  }
  function stall(d, now) {
    const { x, y, c } = d;
    shadow(x + 5, y + 22, 36, 7);
    g.fillStyle = '#5a2a3a'; g.fillRect(x - 28, y - 6, 56, 26);
    g.fillStyle = '#3a1a28'; g.fillRect(x - 28, y + 12, 56, 8);
    for (let k = 0; k < 7; k++) { g.fillStyle = k % 2 ? c : '#fff5ea'; g.beginPath(); g.moveTo(x - 32 + k * 9.3, y - 20); g.lineTo(x - 32 + (k + 1) * 9.3, y - 20); g.lineTo(x - 32 + (k + 1) * 9.3, y - 8); g.quadraticCurveTo(x - 32 + (k + 0.5) * 9.3, y - 3, x - 32 + k * 9.3, y - 8); g.fill(); }
    add(() => glow(x, y + 4, 30, 'rgba(255,200,120,.45)'));
    g.fillStyle = '#ffd36b'; for (let k = 0; k < 3; k++) { g.beginPath(); g.arc(x - 14 + k * 14, y + 4, 4, 0, TAU); g.fill(); }
  }
  function balloons(d, now) {
    const { x, y } = d;
    shadow(x, y + 24, 10, 3);
    const cols = ['#ff6b6b', '#ffc94a', '#4cc9f0', '#b388ff'];
    for (let k = 0; k < 4; k++) {
      const bx = x - 15 + k * 10 + (REDUCED ? 0 : Math.sin(now / 700 + k + d.ph) * 3), by = y - 34 - (k % 2) * 12;
      g.strokeStyle = 'rgba(255,255,255,.4)'; g.lineWidth = 1; g.beginPath(); g.moveTo(x, y + 20); g.quadraticCurveTo(bx, by + 24, bx, by + 12); g.stroke();

      add(() => glow(0, -21, 9, 'rgba(255,220,120,.7)'));
      g.restore();
    } else {
      // örgü bere ve rüzgârda uçuşan atkı
      g.save();
      g.fillStyle = '#2a1030'; g.beginPath(); g.ellipse(0, -R + 1, 15, 9, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#e8463a'; g.beginPath(); g.ellipse(0, -R + 1, 13.5, 8, 0, Math.PI, 0); g.fill();
      g.fillStyle = '#fff5ea'; g.fillRect(-13.5, -R - 1, 27, 3.4);
      g.fillStyle = '#fff'; g.beginPath(); g.arc(0, -R - 8, 3.6, 0, TAU); g.fill();
      const fl = REDUCED ? 0 : Math.sin(now / 160) * 3;
      g.fillStyle = '#e8463a'; g.strokeStyle = '#2a1030'; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(8, R - 4); g.quadraticCurveTo(20, R + fl, 26, R + 6 + fl); g.lineTo(22, R + 10 + fl); g.quadraticCurveTo(16, R + 4, 5, R + 1); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = '#fff5ea'; g.fillRect(19, R + 3 + fl, 4, 2);
      g.restore();
    }
  }

  // ---- efektler ----
  function effects(now, top, bot) {
    // gökyüzünde fişekler (Havai Fişek ekrandayken)
    if (!REDUCED && Math.random() < 0.03 && bot > SPLIT) S.fireworks.push({ x: 40 + Math.random() * (W - 80), y: Math.max(SPLIT + 60, top + 50 + Math.random() * 180), t0: now, c: ['#ffd34a', '#ff6fb5', '#4cc9f0', '#ff7a45', '#b388ff'][Math.floor(Math.random() * 5)] });
    S.fireworks = S.fireworks.filter(f => now - f.t0 < 1600);
    add(() => {
      for (const f of S.fireworks) {
        const u = (now - f.t0) / 1600, e = 1 - Math.pow(1 - u, 3);
        if (u < 0.08) { glow(f.x, f.y, 60, 'rgba(255,255,255,.6)', 1 - u / 0.08); }
        for (let k = 0; k < 22; k++) {
          const a = k * TAU / 22, d = 56 * e, x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d + 26 * u * u;
          g.strokeStyle = f.c; g.globalAlpha = 0.9 * (1 - u); g.lineWidth = 2;
          g.beginPath(); g.moveTo(f.x + Math.cos(a) * d * 0.7, f.y + Math.sin(a) * d * 0.7 + 20 * u * u); g.lineTo(x, y); g.stroke();
          g.fillStyle = '#fff'; g.beginPath(); g.arc(x, y, 1.6, 0, TAU); g.fill();
        }
        g.globalAlpha = 1;
      }
    });
    S.fx = S.fx.filter(p => p.life > 0);
    for (const p of S.fx) {
      p.x += p.vx; p.y += p.vy; p.life -= p.k === 'conf' ? 0.008 : 0.03;
      if (p.k === 'conf') { p.vy += 0.12; p.vx *= 0.99; p.r += p.vr; g.save(); g.globalAlpha = Math.min(1, p.life * 2); g.translate(p.x, p.y); g.rotate(p.r); g.fillStyle = p.c; g.fillRect(-4, -2, 8, 4); g.restore(); }
      else if (p.k === 'puff') { p.vx *= 0.94; p.vy *= 0.94; p.r += 0.25; g.fillStyle = `rgba(${p.c},${0.45 * p.life})`; g.beginPath(); g.arc(p.x, p.y, p.r, 0, TAU); g.fill(); }
      else if (p.k === 'coin') { p.vy += 0.25; g.save(); g.globalAlpha = Math.min(1, p.life * 2); g.translate(p.x, p.y); g.scale(Math.abs(Math.cos(now / 90 + p.r)), 1); g.fillStyle = '#d98f12'; g.beginPath(); g.arc(0, 0, 6, 0, TAU); g.fill(); g.fillStyle = '#ffd54a'; g.beginPath(); g.arc(0, 0, 4.6, 0, TAU); g.fill(); g.restore(); }
      else add(() => { g.globalAlpha = p.life; g.fillStyle = p.c; star(p.x, p.y, 3.4); g.globalAlpha = 1; });
    }
    // yıldızlar sayaca uçar
    S.flyStars = S.flyStars.filter(s => now < s.t0 + 700);
    for (const s of S.flyStars) {
      const t = Math.max(0, (now - s.t0) / 700); if (now < s.t0) continue;
      const e = t * t, tx = W - 50, ty = S.camY + 10;
      const x = s.x + (tx - s.x) * e, y = s.y + (ty - s.y) * e - Math.sin(Math.PI * t) * 60;
      add(() => glow(x, y, 16, 'rgba(255,210,100,.8)'));
      g.fillStyle = '#ffc94a'; star(x, y, 8 * (1 - 0.4 * t));
    }
    // kar (sis kalkınca, Buzul ekrandayken)
    if (S.fog < 0.6 && top < SPLIT && !REDUCED) {
      S.snow = S.snow || [];
      while (S.snow.length < 70) S.snow.push({ x: Math.random() * W, y: top + Math.random() * (bot - top), r: 1 + Math.random() * 2.2, v: 0.5 + Math.random() * 0.8 });
      for (const f of S.snow) { f.y += f.v; f.x += Math.sin(f.y / 40) * 0.4; if (f.y > Math.min(bot, SPLIT)) { f.y = top - 10; f.x = Math.random() * W; } g.fillStyle = 'rgba(255,255,255,.85)'; g.beginPath(); g.arc(f.x, f.y, f.r, 0, TAU); g.fill(); }
    }
  }
  // İnişte toz bulutu (Buzul'da kar tozu)
  function dust(i) {
    if (REDUCED) return;
    const n = NODES[i], snow = i >= 10;
    for (let k = 0; k < 12; k++) { const a = Math.PI + (k / 11) * Math.PI, sp = 1 + Math.random() * 1.6; S.fx.push({ k: 'puff', x: n.x + Math.cos(a) * 14, y: n.y + 2, vx: Math.cos(a) * sp, vy: -0.3 - Math.random() * 0.5, life: 1, r: 3 + Math.random() * 3, c: snow ? '255,255,255' : '255,220,200' }); }
  }
  function confetti(x, y, n) { for (let k = 0; k < n; k++) { const a = Math.random() * TAU, sp = 2 + Math.random() * 5; S.fx.push({ k: 'conf', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 4, life: 1, r: 0, vr: (Math.random() - 0.5) * 0.3, c: ['#ffd34a', '#ff6fb5', '#4cc9f0', '#ff7a45', '#b388ff'][k % 5] }); } }
  function coins(x, y, n) { for (let k = 0; k < n; k++) S.fx.push({ k: 'coin', x, y, vx: (Math.random() - 0.5) * 5, vy: -4 - Math.random() * 3, life: 1, r: Math.random() * 6 }); }
  function shake() { if (REDUCED) return; const m = $('map'); m.classList.remove('shake'); void m.offsetWidth; m.classList.add('shake'); }

  // =================== AKIŞ ===================
  function winLevel() {
    if (S.hop || S.done >= N - 1 || S.gateT && S.gateOpen < 1 && S.done === 9) return;
    if (S.done === 9 && !S.gateT) { openGate(); return; }
    const from = S.done, to = from + 1;
    S.follow = true;
    const mode = TRAVEL[STATIONS[from].kind], ms = REDUCED ? 1 : TRAVEL_MS[mode] || 720;
    S.hop = { from, to, t0: performance.now(), ms, mode };
    setTimeout(() => launch(mode, from), REDUCED ? 0 : CROUCH);
    const n = NODES[from];
    for (let k = 0; k < STARS[from]; k++) S.flyStars.push({ x: n.x - 15 + k * 15, y: n.y - 20, t0: performance.now() + 150 + k * 140 });
    for (let k = 0; k < STARS[from]; k++) setTimeout(() => { sfx.star(k); S.shownStars++; updateHud(); bumpStars(); }, 150 + k * 140 + 700);
    setTimeout(() => {
      S.hop = null; S.done = to; S.land = { i: to, t0: performance.now() }; sfx.land(); dust(to);
      // 3 yıldızla geçilen bölümden sonra küçük bir sevinç zıplaması, gözler yıldız olur
      if (STARS[from] === 3 && !REDUCED) setTimeout(() => { S.cheer = performance.now(); S.cheerStar = true; tone(1568, 0.15, 'triangle', 0.05); tone(2093, 0.2, 'triangle', 0.05, 0, 0.08); }, 320);
      else S.cheerStar = false;
      if (REWARDS[from] && !S.opened[from]) openReward(from);
      if (S.done === 9) $('win').textContent = 'Kapıyı aç ▶';
      if (S.done >= N - 1) { $('win').disabled = true; $('win').textContent = 'Prototipin sonu'; }
      updateHud();
    }, REDUCED ? 10 : CROUCH + ms + 20);
  }
  // Kalkış: istasyona göre ses ve patlama
  function launch(mode, i) {
    const st = STATIONS[i], n = NODES[i];
    const smoke = (x, y, k, c) => { if (!REDUCED) for (let j = 0; j < k; j++) { const a = Math.random() * TAU, sp = 0.6 + Math.random() * 1.8; S.fx.push({ k: 'puff', x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp * 0.5, life: 1, r: 4 + Math.random() * 4, c }); } };
    if (mode === 'rocket') { noise(0.9, 0.22, 500, 2600); tone(220, 0.8, 'sawtooth', 0.03, 880); smoke(n.x, n.y, 16, '230,215,240'); }
    else if (mode === 'cannon') { noise(0.35, 0.3, 1800, 200); tone(140, 0.25, 'sine', 0.15, 60); confetti(st.x, st.y - 20, 24); smoke(st.x, st.y - 10, 8, '240,230,245'); shake(); }
    else if (mode === 'bounce') { tone(150, 0.2, 'sine', 0.16, 70); tone(260, 0.4, 'sine', 0.08, 780, 0.5); }
    else if (mode === 'balloon' || mode === 'lantern') { tone(523, 0.6, 'sine', 0.05, 1046); tone(784, 0.5, 'triangle', 0.03, 0, 0.15); }
    else if (mode === 'bird') { [1800, 2200, 1900, 2400].forEach((f, k) => tone(f, 0.07, 'sine', 0.05, f * 1.2, k * 0.09)); }
    else if (mode === 'teleport') { [1047, 1319, 1568, 2093].forEach((f, k) => tone(f, 0.25, 'triangle', 0.045, 0, k * 0.05)); }
    else if (PATH_MODES.has(mode)) { noise(0.9, 0.12, 2400, 900); tone(330, 0.5, 'triangle', 0.04, 660); }
    else sfx.hop();
  }
  function openReward(i) {
    S.opened[i] = performance.now();
    const n = NODES[i], x = n.x + (n.x > W / 2 ? -58 : 58), y = n.y - 10;
    sfx.chest(); confetti(x, y, 26);
    if (REWARDS[i] === 'chest') { coins(x, y, 10); for (let k = 0; k < 6; k++) setTimeout(() => sfx.coin(k), 300 + k * 70); }
    else add(() => {});
  }
  // Kapı: kanatlar açılır (sarsıntı, ışık hüzmeleri, fişek yağmuru); sis kalkar, kamera Buzul'a süzülür, halka geçer
  function openGate() {
    S.gateT = performance.now(); $('win').disabled = true;
    sfx.boom(); shake(); confetti(W / 2, GATE_Y - 40, 90); sfx.fanfare();
    if (!REDUCED) for (let k = 0; k < 6; k++) setTimeout(() => S.fireworks.push({ x: 60 + Math.random() * (W - 120), y: GATE_Y - 220 - Math.random() * 120, t0: performance.now(), c: ['#ffd34a', '#ff6fb5', '#4cc9f0', '#ff7a45'][k % 4] }), k * 180);
    setTimeout(() => { S.fogT = performance.now(); sfx.wind(); }, REDUCED ? 10 : 1300);
    setTimeout(() => {
      S.follow = false; S.camTarget = clampCam(yOf(12) - viewH() * 0.45);
      setTimeout(() => {
        S.follow = true; S.hop = { from: 9, to: 10, t0: performance.now(), ms: REDUCED ? 1 : 1000, big: true }; setTimeout(() => sfx.hop(), CROUCH);
        setTimeout(() => { S.hop = null; S.done = 10; S.land = { i: 10, t0: performance.now() }; sfx.land(); dust(10); S.cheer = performance.now(); S.cheerStar = true; updateHud(); $('win').disabled = false; $('win').textContent = 'Bölümü kazan ▶'; }, REDUCED ? 10 : CROUCH + 1020);
      }, REDUCED ? 10 : 1500);
    }, REDUCED ? 20 : 2100);
  }

  // ---- kamera ----
  cv.addEventListener('pointerdown', e => { S.drag = { y: e.clientY, cam: S.camY, x0: e.clientX, y0: e.clientY }; S.follow = false; cv.setPointerCapture(e.pointerId); cv.style.cursor = 'grabbing'; });
  cv.addEventListener('pointermove', e => { if (!S.drag) return; S.camTarget = clampCam(S.drag.cam - (e.clientY - S.drag.y) * (W / cv.clientWidth)); S.camY = S.camTarget; });
  const up = e => {
    const d = S.drag; S.drag = null; cv.style.cursor = 'grab';
    if (!d || !e || e.type !== 'pointerup' || Math.hypot(e.clientX - d.x0, e.clientY - d.y0) > 6 || !S.playBtn) return;
    const r = cv.getBoundingClientRect(), k = W / cv.clientWidth, x = (e.clientX - r.left) * k, y = S.camY + (e.clientY - r.top) * k, b = S.playBtn;
    if (x > b.x - 6 && x < b.x + b.w + 6 && y > b.y - 6 && y < b.y + b.h + 6) { S.follow = true; winLevel(); }
  };
  cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);
  cv.addEventListener('wheel', e => { e.preventDefault(); S.follow = false; S.camTarget = clampCam(S.camTarget + e.deltaY * 0.8); }, { passive: false });
  function resize() { const dpr = Math.min(devicePixelRatio || 1, 3); cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientHeight * dpr); }
  new ResizeObserver(resize).observe(cv);

  function frame(now) {
    const scale = cv.width / W, vh = viewH();
    if (S.gateT) S.gateOpen = Math.min(1, (now - S.gateT) / 1200);
    if (S.fogT) S.fog = Math.max(0, 1 - (now - S.fogT) / 1700);
    if (S.follow) S.camTarget = clampCam(charPos(now).y - vh * 0.62);
    S.camY += (S.camTarget - S.camY) * (REDUCED ? 1 : 0.08);
    const top = S.camY, bot = S.camY + vh;
    g.setTransform(scale, 0, 0, scale, 0, -S.camY * scale);
    g.clearRect(0, top, W, vh);
    if (top < SPLIT) groundBuzul(top, Math.min(bot, SPLIT), now);
    if (bot > SPLIT) groundFisek(Math.max(top, SPLIT), bot, now);
    const lit = S.hop ? S.hop.from + (S.hop.to - S.hop.from) * Math.max(0, Math.min(1, (now - S.hop.t0 - CROUCH) / S.hop.ms)) : S.done;
    road(lit, now, top, bot);
    decor(top, bot, now);
    castle(now);
    pedestals(now);
    fog(now, top, bot);
    hero(now);
    // ad şeridi maskotun önünde kalsın
    banners.splice(0).forEach(st => nameBanner(st, now));
    effects(now, top, bot);
    // kenar gölgesi (derinlik)
    g.setTransform(1, 0, 0, 1, 0, 0);
    const vg = g.createRadialGradient(cv.width / 2, cv.height / 2, cv.height * 0.35, cv.width / 2, cv.height / 2, cv.height * 0.8);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(5,2,10,.45)'); g.fillStyle = vg; g.fillRect(0, 0, cv.width, cv.height);
    requestAnimationFrame(frame);
  }
  $('win').onclick = winLevel;
  $('reset').onclick = reset;
  resize(); reset(); requestAnimationFrame(frame);
  window.__map = { get S() { return S; }, winLevel, hero: () => { const q = charPos(performance.now()), k = cv.clientWidth / W; return { x: q.x * k, y: (q.y - S.camY) * k }; } };
})();
</script>
