<title>Dünya Müzikleri</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Z16: 16 dünyanın müzik çeşitlemesini oyunun kendi motoruyla (../music.js) dinleme sayfası */
:root {
  --bg: #0b0d1c; --panel: #171a33; --line: #2b3060; --fg: #f1efff; --muted: #c6c4e4;
  --accent: #8fb4ff; --gold: #ffc94a; --gold-ink: #3d2a00;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background-color: var(--bg); color: var(--fg); font-family: var(--body); min-height: 100vh; }
main { max-width: 460px; margin: 0 auto; padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
.eyebrow { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.1; color: var(--accent); }
p { margin: 0; color: var(--muted); line-height: 1.45; }
.worlds { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
.worlds button { text-align: left; font: 700 12px var(--body); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; cursor: pointer; display: grid; gap: 2px; }
.worlds button b { font: 800 15px var(--display); color: var(--fg); }
.worlds button[aria-pressed="true"] { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.row { display: flex; gap: 8px; flex-wrap: wrap; position: sticky; bottom: 0; padding-block: 8px; background: var(--bg); }
.row button { flex: 1; font: 800 14px var(--body); border-radius: 14px; padding: 12px 8px; cursor: pointer; border: 1px solid var(--line); background: #20244a; color: var(--fg); }
.row button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
.row + .row { position: static; padding-top: 0; }
.row button.main { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
</style>
<main>
  <div><div class="eyebrow">Z16 · dünya müzikleri</div><h1>16 dünya, 16 çeşitleme</h1></div>
  <p>Ezgi ve halka motifi her dünyada aynı; ton, tempo ve çalgılar dünyaya göre değişir. Bir dünya seç, <b>Çal</b>'a bas, sonra <b>Halka kurtar</b> (ya da boşluk tuşu) ile tahtayı boşalt. Çalarken başka dünyaya geçersen yeni çeşitleme bir sonraki ölçüde girer.</p>
  <div class="worlds" id="worlds"></div>
  <div class="row"><button id="play" class="main">Çal</button><button id="free">Halka kurtar</button><button id="chain">Zincir</button></div>
  <div class="row"><button id="boss" aria-pressed="false">Dev Halka</button><button id="rain" aria-pressed="false">Altın Yağmuru</button><button id="hit">Dev yenildi</button></div>
</main>
<script src="../music.js"></script>
<script>
'use strict';
const NAMES = { vadi: 'Başlangıç Vadisi', atolye: 'Atölye', saat: 'Saat Kulesi', zindan: 'Zindan', sehir: 'Şehir', fabrika: 'Fabrika', uzay: 'Uzay', usta: 'Büyük Usta',
  lunapark: 'Lunapark', santral: 'Santral', fener: 'Deniz Feneri', rasathane: 'Rasathane', fisek: 'Havai Fişek', buzul: 'Buzul', degirmen: 'Değirmen', buyu: 'Büyü Kulesi' };
const INST = { celesta: 'celesta', marimba: 'marimba', kalimba: 'kalimba', pluck: 'telli', musicBox: 'müzik kutusu', flute: 'flüt', organ: 'org', glock: 'zil', steel: 'steel pan' };
let ac = null, world = 'vadi', playing = false, left = 0, mode = null;
const music = window.RingMusic.Music(() => { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); return ac; });
const $ = id => document.getElementById(id);
function render() {
  $('worlds').innerHTML = Object.entries(window.RingMusic.STYLES).map(([id, [, bpm, lead, pulse]]) =>
    `<button data-w="${id}" aria-pressed="${id === world}"><b>${NAMES[id]}</b>${INST[lead]} + ${INST[pulse]} · ${bpm} BPM</button>`).join('');
  $('play').textContent = playing ? 'Durdur' : 'Çal';
  $('boss').setAttribute('aria-pressed', String(mode === 'boss')); $('rain').setAttribute('aria-pressed', String(mode === 'rain'));
}
function start() { music.mode(mode); music.world(world); music.volume(0.6); music.play(); music.progress(0); playing = true; left = 8; render(); }
function free(n) {
  if (!playing) return start();
  n = Math.min(n, left); left -= n;
  music.free(n); music.progress(1 - left / 8);
  if (n >= 3) music.sparkle(n);
  if (!left && mode === 'rain') { left = 8; music.progress(0); return; } // yağmurda tahta yenilenir, müzik durmaz
  if (!left) { music.resolve(); playing = false; render(); }
}
$('worlds').onclick = e => { const b = e.target.closest('button'); if (!b) return; world = b.dataset.w; music.world(world); render(); };
$('play').onclick = () => { if (playing) { music.stop(); playing = false; render(); } else start(); };
$('free').onclick = () => free(1);
$('chain').onclick = () => free(3);
// özel anlar: seçilince müzik o kipte baştan çalar
for (const m of ['boss', 'rain']) $(m).onclick = () => { mode = mode === m ? null : m; music.stop(); start(); };
$('hit').onclick = () => music.hit();
document.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); free(1); } });
render();
</script>
