<title>İnci Halka Prototipi</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@600;700;800&display=swap">
<style>
/* Tek koyu görünüm, oyunun Mercan Resifi dünyası: dar sütun, üstte bölüm seçimi, ortada tahta, altta hamle ve düğmeler */
:root {
  --bg: #040f16; --panel: #0e2a36; --line: #1d4a5a; --fg: #effbff; --muted: #9cc7d2;
  --accent: #ff8a7a; --gold: #ffcf7a; --gold-ink: #3a2500;
  --display: "Baloo 2", "Nunito", system-ui, sans-serif; --body: "Nunito", system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; background: radial-gradient(70% 45% at 15% 0%, rgba(255, 138, 122, .14), transparent 70%), radial-gradient(50% 35% at 100% 30%, rgba(45, 212, 191, .12), transparent 70%), linear-gradient(180deg, #0b2230, var(--bg)); background-color: var(--bg); color: var(--fg); font-family: var(--body); min-height: 100vh; }
main { max-width: 440px; margin: 0 auto; padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 14px; }
header { display: grid; gap: 2px; }
.eyebrow { font-weight: 800; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 0; font-family: var(--display); font-size: 28px; line-height: 1.1; color: var(--accent); }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tabs button { font: 800 13px var(--body); color: var(--muted); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--gold-ink); background: var(--gold); border-color: var(--gold); }
.tabs button.done::after { content: " ✓"; }
.tip { margin: 0; color: var(--muted); font-size: 15px; line-height: 1.45; min-height: 2.9em; }
.tip b { color: var(--fg); }
.board { position: relative; width: 100%; aspect-ratio: 400 / 520; border-radius: 22px; background: rgba(0, 0, 0, .28); border: 1px solid var(--line); overflow: hidden; touch-action: none; }
canvas { display: block; width: 100%; height: 100%; }
.bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.count { flex: 1; font-weight: 800; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { color: var(--fg); font-family: var(--display); font-size: 22px; }
.bar button { font: 800 15px var(--body); border-radius: 14px; padding: 10px 14px; cursor: pointer; border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.bar button.primary { background: var(--gold); color: var(--gold-ink); border-color: var(--gold); }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
[hidden] { display: none !important; }
.win { position: absolute; inset: 0; display: grid; place-content: center; gap: 10px; text-align: center; background: rgba(4, 15, 22, .72); backdrop-filter: blur(3px); }
.win h2 { margin: 0; font-family: var(--display); font-size: 38px; color: var(--gold); }
.win p { margin: 0; color: var(--muted); }
.win button { justify-self: center; font: 800 16px var(--body); border-radius: 14px; padding: 10px 20px; border: 0; background: var(--gold); color: var(--gold-ink); cursor: pointer; }
.legend { display: grid; gap: 6px; font-size: 14px; color: var(--muted); padding: 12px 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
.legend b { color: var(--fg); }
</style>

<main>
  <header>
    <span class="eyebrow">Mercan Resifi · prototip</span>
    <h1>İnci Halka</h1>
  </header>
  <div class="tabs" id="tabs"></div>
  <p class="tip" id="tip"></p>
  <div class="board" id="board">
    <canvas id="cv" aria-label="Oyun tahtası"></canvas>
    <div class="win" id="win" hidden>
      <h2 id="winTitle">Kusursuz!</h2>
      <p id="winText"></p>
      <button id="next" type="button">Sonraki bölüm</button>
    </div>
  </div>
  <div class="bar">
    <span class="count">Hamle <b id="moves">0</b> · en iyi <span id="par">1</span></span>
    <button id="reset" type="button">Baştan</button>
    <button id="hint" class="primary" type="button">İpucu</button>
  </div>
  <div class="legend" id="legend"></div>
</main>

<script src="../logic.js"></script>
<script>
(function () {
  'use strict';
  const Logic = window.RingLogic;
  const { TAU, DEG, GAP_HALF } = Logic;
  const W = 400, H = 520, STROKE = 13;
  // Mercan Resifi renkleri: mercan, deniz yeşili, gece mavisi; istiridye lila-gri, inci sedef
  const COLORS = ['#ff8a7a', '#2dd4bf', '#5b8def'];
  const SHELL = '#a99bc4', PEARL = '#f4efe6';

  // R10 deneme bölümleri (çözücüyle seçildi). trap: istiridyeyi ilk hamlede açmanın bedeli, after: inci belirdikten sonra hamle
  const P2 = [[130, 220, 66], [130, 220, 38, 0], [270, 220, 66], [270, 220, 38, 2], [200, 300, 60], [200, 140, 56], [130, 330, 54]];
  const two = a => P2.map(([x, y, r, pearl], i) => ({ x, y, r, a: a[i], ...(pearl != null ? { pearl } : {}) }));
  const LEVELS = [
    { name: 'İlk inci', tip: 'Dalgalı kenarlı halka bir <b>istiridye</b>. Kurtulunca içindeki <b>inci halka</b> belirir ve onu da kurtarman gerekir.',
      rings: [[200, 260, 70], [200, 260, 40, 0], [285, 260, 58], [140, 320, 58], [150, 165, 56]].map(([x, y, r, pearl], i) => ({ x, y, r, a: [135, 105, 270, 105, 300][i], ...(pearl != null ? { pearl } : {}) })) },
    { name: 'İnci sona', tip: 'İnci belirince değdiği halkaları tutar. İstiridyeyi <b>erken</b> açarsan bir hamle kaybedersin.',
      rings: two([270, 105, 300, 195, 60, 165, 195]) }, // trap 4, after 1
    { name: 'İki istiridye', tip: 'İki inci, aralarında köprü. Hangi istiridye önce açılmalı?',
      rings: two([135, 195, 75, 30, 210, 180, 150]) }, // after 2
    { name: 'Derin dalış', tip: 'İncilerden biri belirince hemen kurtulmaz: onun için de bir hamle sakla.',
      rings: two([255, 0, 120, 45, 225, 135, 105]) }, // 4 hamle, after 1
  ];

  const $ = id => document.getElementById(id);
  const cv = $('cv'), ctx = cv.getContext('2d');
  const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const done = new Set();
  let S = null;
  $('legend').innerHTML =
    '<span><b>Dalgalı kenarlı lila halka istiridyedir.</b> İçinde parlayan inci, istiridye kurtulunca kesik çizgili yerinde bir halkaya dönüşür.</span>' +
    '<span>İnci görünmezken hiçbir halkayı tutmaz; belirince değdiği halkaları tutar. Önce incinin komşularını kurtarırsan inci belirir belirmez uçar.</span>';

  function centered(rings) {
    let x0 = Infinity, x1 = -Infinity, y0 = Infinity, y1 = -Infinity;
    for (const r of rings) { x0 = Math.min(x0, r.x - r.r); x1 = Math.max(x1, r.x + r.r); y0 = Math.min(y0, r.y - r.r); y1 = Math.max(y1, r.y + r.r); }
    const dx = W / 2 - (x0 + x1) / 2, dy = H / 2 - (y0 + y1) / 2;
    return rings.map(r => ({ ...r, x: r.x + dx, y: r.y + dy }));
  }

  function load(k) {
    const L = Logic.buildLevel({ rings: centered(LEVELS[k].rings) });
    const sol = Logic.solve(L, L.startAngles, 0, 200000);
    S = { k, L, angles: L.startAngles.slice(), mask: 0, moves: 0, par: sol ? sol.moves : '?', busy: false,
      fly: {}, hidden: 0, drag: null, praise: null, hintRing: -1, born: {}, halves: [] };
    $('tip').innerHTML = LEVELS[k].tip;
    $('par').textContent = S.par;
    $('moves').textContent = 0;
    $('win').hidden = true;
    renderTabs();
  }

  function renderTabs() {
    $('tabs').innerHTML = LEVELS.map((l, i) =>
      `<button type="button" data-k="${i}" aria-pressed="${i === S.k}" class="${done.has(i) ? 'done' : ''}">${i + 1}. ${l.name}</button>`).join('');
    $('tabs').querySelectorAll('button').forEach(b => { b.onclick = () => load(+b.dataset.k); });
  }

  // ---- ses: istiridye açılır (su kabarcığı + kabuk çıtı), inci belirir (sedef tınısı), kurtulma ----
  let AC = null;
  const audio = () => (AC = AC || new (window.AudioContext || window.webkitAudioContext)());
  function tone(t, freq, len, vol, type, to) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t);
    if (to) o.frequency.exponentialRampToValueAtTime(to, t + len);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.008); g.gain.exponentialRampToValueAtTime(0.0001, t + len);
    o.connect(g).connect(AC.destination); o.start(t); o.stop(t + len + 0.02);
  }
  const sound = {
    pearl() {
      try {
        const t = audio().currentTime;
        for (let k = 0; k < 4; k++) tone(t + k * 0.05, 300 + Math.random() * 300, 0.08, 0.05, 'sine', 900 + Math.random() * 600); // kabarcık
        tone(t + 0.05, 1200, 0.04, 0.05, 'triangle');                                                                    // kabuk çıtı
        for (const [d, f] of [[0.18, 1046.5], [0.26, 1318.5], [0.34, 1568], [0.42, 2093]]) { tone(t + d, f, 1.2, 0.05); tone(t + d, f * 2.01, 0.6, 0.015); }
      } catch (e) { /* sessiz */ }
    },
    free(n) { try { const t = audio().currentTime; for (let k = 0; k < Math.min(n, 5); k++) tone(t + k * 0.06, 523.25 * Math.pow(2, [0, 4, 7, 12, 16][k] / 12), 0.3, 0.12); } catch (e) { /* sessiz */ } },
  };

  // ---- çizim ----
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    cv.width = Math.round(cv.clientWidth * dpr); cv.height = Math.round(cv.clientWidth * H / W * dpr);
  }
  const present = i => !(S.hidden & (1 << i));
  const veiled = i => Logic.hidden(S.L, i, S.mask);
  const live = i => present(i) && !S.fly[i] && !veiled(i);
  const isShell = i => S.L.shellOf.includes(i);
  const colorOf = i => (S.L.shellOf[i] >= 0 ? PEARL : isShell(i) ? SHELL : COLORS[i % COLORS.length]);

  function pose(i, now) {
    const r = S.L.rings[i], f = S.fly[i];
    if (!f) return { x: r.x, y: r.y, alpha: 1, grow: 1 };
    const t = Math.min(Math.max((now - f.t0) / f.ms, 0), 1), e = t * t;
    return { x: r.x + f.dx * f.dist * e, y: r.y + f.dy * f.dist * e, alpha: 1 - t, grow: 1 + 0.18 * t };
  }
  function eachArc(ring, angle, each) {
    const gaps = ring.gaps.map(g => Logic.norm(angle + g)).sort((a, b) => a - b);
    for (let k = 0; k < gaps.length; k++) each(gaps[k] + GAP_HALF, (k + 1 < gaps.length ? gaps[k + 1] : gaps[0] + TAU) - GAP_HALF);
  }
  function arcs(ring, angle, x, y, color, width, r) {
    ctx.strokeStyle = color; ctx.lineWidth = width; ctx.lineCap = 'round';
    eachArc(ring, angle, (from, to) => { ctx.beginPath(); ctx.arc(x, y, r || ring.r, from, to); ctx.stroke(); });
  }
  // İstiridye: dış kenarı dalgalı kabuk (halkayla döner), üstünde ışınsal oluklar
  function shellRidges(ring, angle, x, y) {
    ctx.fillStyle = SHELL; ctx.strokeStyle = 'rgba(4,15,22,.6)'; ctx.lineWidth = 1.4;
    eachArc(ring, angle, (from, to) => {
      const step = 13 / ring.r;
      for (let th = from + step * 0.3; th + step <= to; th += step) {
        const r0 = ring.r + STROKE / 2 - 1;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(th) * r0, y + Math.sin(th) * r0);
        ctx.quadraticCurveTo(x + Math.cos(th + step / 2) * (r0 + 9), y + Math.sin(th + step / 2) * (r0 + 9), x + Math.cos(th + step) * r0, y + Math.sin(th + step) * r0);
        ctx.closePath(); ctx.fill(); ctx.stroke();
      }
    });
  }
  function grooves(ring, angle, x, y) {
    ctx.strokeStyle = 'rgba(70,55,100,.55)'; ctx.lineWidth = 1.6;
    eachArc(ring, angle, (from, to) => {
      for (let th = from + 0.1; th < to; th += 9 / ring.r) {
        ctx.beginPath(); ctx.moveTo(x + Math.cos(th) * (ring.r - 5), y + Math.sin(th) * (ring.r - 5)); ctx.lineTo(x + Math.cos(th) * (ring.r + 5), y + Math.sin(th) * (ring.r + 5)); ctx.stroke();
      }
    });
  }
  // Saklı inci: istiridyenin içinde parlayan sedef top ve incinin belireceği yer (kesik çizgi)
  function hiddenPearl(i, now) {
    const r = S.L.rings[i], sh = S.L.rings[S.L.shellOf[i]];
    const P = pose(S.L.shellOf[i], now);
    const ox = P.x - sh.x, oy = P.y - sh.y;
    ctx.save();
    ctx.globalAlpha = P.alpha;
    ctx.setLineDash([5, 7]); ctx.strokeStyle = 'rgba(244,239,230,.35)'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x + ox, r.y + oy, r.r, 0, TAU); ctx.stroke(); ctx.setLineDash([]);
    pearlBall(r.x + ox, r.y + oy, 11 + (REDUCED ? 0 : Math.sin(now / 400) * 1.2), now);
    ctx.restore();
  }
  function pearlBall(x, y, s, now) {
    const g = ctx.createRadialGradient(x - s * 0.35, y - s * 0.4, 1, x, y, s);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.45, '#f4efe6'); g.addColorStop(0.8, '#d8cfe6'); g.addColorStop(1, '#b7a9cf');
    ctx.shadowColor = 'rgba(255,255,255,.7)'; ctx.shadowBlur = 14;
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(x, y, s, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // sedef yanardönerliği: dönen ince renkli hilal
    ctx.strokeStyle = `hsla(${(now / 12) % 360},80%,80%,.55)`; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.arc(x, y, s * 0.7, now / 700, now / 700 + 1.6); ctx.stroke();
  }

  function draw(now) {
    const dpr = cv.width / W;
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.clearRect(0, 0, cv.width, cv.height);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const L = S.L;
    for (const link of L.links) {
      if (!live(link.a) || !live(link.b)) continue;
      for (const p of link.pts) {
        if (!Logic.pointOpen(L, link, p, S.angles)) continue;
        const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
        g.addColorStop(0, 'rgba(255,255,255,.95)'); g.addColorStop(.35, 'rgba(255,255,255,.55)'); g.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, TAU); ctx.fill();
      }
    }
    for (let i = 0; i < L.rings.length; i++) {
      if (!present(i)) continue;
      if (veiled(i)) { hiddenPearl(i, now); continue; }
      const r = L.rings[i], P = pose(i, now), color = colorOf(i), ang = S.angles[i];
      // inci belirirken merkezden büyür
      const b = S.born[i] ? Math.min(1, (now - S.born[i]) / 420) : 1, rr = r.r * (b < 1 ? 0.25 + 0.75 * (1 - Math.pow(1 - b, 3)) : 1);
      ctx.save();
      ctx.globalAlpha = P.alpha;
      ctx.translate(P.x, P.y); ctx.scale(P.grow, P.grow); ctx.translate(-P.x, -P.y);
      const active = (S.drag && S.drag.ring === i) || S.hintRing === i;
      arcs(r, ang, P.x + 2, P.y + 4, 'rgba(0,0,0,.42)', STROKE + 6, rr);
      if (isShell(i)) shellRidges(r, ang, P.x, P.y);
      if (active) { ctx.shadowColor = color; ctx.shadowBlur = 20; }
      arcs(r, ang, P.x, P.y, color, STROKE, rr);
      ctx.shadowBlur = 0;
      if (isShell(i)) grooves(r, ang, P.x, P.y);
      if (L.shellOf[i] >= 0) {
        // sedef parıltısı: halka boyunca kayan yanardöner şerit
        const th = REDUCED ? ang + Math.PI : now / 650 + i;
        ctx.strokeStyle = `hsla(${(now / 10 + i * 60) % 360},85%,82%,.75)`; ctx.lineWidth = 4;
        if (!r.gaps.some(g => Logic.angDist(ang + g, th) < GAP_HALF + 0.4)) { ctx.beginPath(); ctx.arc(P.x, P.y, rr, th - 0.35, th + 0.35); ctx.stroke(); }
        if (b < 1) { ctx.globalAlpha = P.alpha * (1 - b); arcs(r, ang, P.x, P.y, '#fff', STROKE + 8, rr); }
      }
      arcs(r, ang, P.x - 1.2, P.y - 1.6, 'rgba(255,255,255,.28)', 3, rr);
      ctx.restore();
    }
    // açılan istiridyenin iki kapağı ayrılıp düşer
    S.halves = S.halves.filter(h => now - h.t0 < 700);
    for (const h of S.halves) {
      const t = (now - h.t0) / 700;
      ctx.save(); ctx.globalAlpha = 1 - t;
      for (const d of [-1, 1]) {
        ctx.save(); ctx.translate(h.x + d * 40 * t, h.y + 60 * t * t); ctx.rotate(d * 0.8 * t);
        ctx.fillStyle = SHELL; ctx.strokeStyle = 'rgba(4,15,22,.7)'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.ellipse(0, 0, h.r * 0.55, h.r * 0.38, 0, d > 0 ? -Math.PI / 2 : Math.PI / 2, d > 0 ? Math.PI / 2 : Math.PI * 1.5); ctx.closePath(); ctx.fill(); ctx.stroke();
        ctx.restore();
      }
      ctx.restore();
    }
    if (S.praise) {
      const t = (now - S.praise.t0) / 1400;
      if (t >= 1) S.praise = null;
      else {
        ctx.save();
        ctx.globalAlpha = t < .12 ? t / .12 : 1 - Math.max(0, (t - .6) / .4);
        ctx.font = '800 44px "Baloo 2", "Nunito", sans-serif'; ctx.textAlign = 'center';
        ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(4,15,22,.85)'; ctx.lineJoin = 'round';
        ctx.translate(W / 2, 72 - 14 * t);
        ctx.strokeText(S.praise.text, 0, 0);
        ctx.fillStyle = S.praise.color || '#ffcf7a'; ctx.fillText(S.praise.text, 0, 0);
        ctx.restore();
      }
    }
    requestAnimationFrame(draw);
  }

  // ---- hareket ----
  const sleep = ms => new Promise(r => setTimeout(r, REDUCED ? 0 : ms));
  function tween(from, to, ms) {
    return new Promise(res => {
      const t0 = performance.now();
      const step = () => {
        const t = REDUCED ? 1 : Math.min((performance.now() - t0) / ms, 1), e = 1 - Math.pow(1 - t, 3);
        S.angles = from.map((a, i) => a + Logic.signedDelta(a, to[i]) * e);
        if (t < 1) requestAnimationFrame(step); else { S.angles = to.slice(); res(); }
      };
      step();
    });
  }
  function launch(i, now) {
    const r = S.L.rings[i], dx = r.x - W / 2, dy = r.y - H / 2, d = Math.hypot(dx, dy) || 1;
    S.fly[i] = { t0: now, dx: dx / d, dy: dy / d - .25, ms: 520, dist: 460 };
  }

  // Dalgalar arka arkaya: istiridye kalkınca kapakları ayrılır, inci belirip büyür; belirdiği dalgada serbestse o da uçar
  async function settle() {
    const L = S.L, st = S;
    const c = Logic.cascade(L, S.angles, S.mask);
    if (!c.waves.length) return;
    S.busy = true;
    let freed = 0, pearls = 0, quick = 0;
    for (const wave of c.waves) {
      const now = performance.now();
      for (const i of wave) {
        if (L.shellOf[i] >= 0 && S.born[i] && now - S.born[i] < 500) { await sleep(500 - (now - S.born[i])); quick++; }
        launch(i, performance.now()); freed++;
      }
      for (const i of wave) S.mask |= 1 << i;
      const opened = wave.filter(i => isShell(i));
      if (opened.length) {
        for (const s of opened) {
          const r = L.rings[s];
          S.halves.push({ x: r.x, y: r.y, r: r.r, t0: performance.now() });
          L.shellOf.forEach((k, p) => { if (k === s) S.born[p] = performance.now(); });
          pearls++;
        }
        sound.pearl();
        await sleep(450); if (S !== st) return;
      } else { await sleep(200); if (S !== st) return; }
    }
    sound.free(freed);
    await sleep(520); if (S !== st) return;
    for (const i of Object.keys(S.fly)) { S.hidden |= 1 << i; delete S.fly[i]; }
    S.mask = c.mask;
    const now = performance.now();
    if (quick) S.praise = { text: 'İnci avcısı!', color: PEARL, t0: now };
    else if (pearls) S.praise = { text: 'İnci belirdi!', color: PEARL, t0: now };
    else if (freed >= 2) S.praise = { text: freed >= 4 ? 'Muhteşem!' : freed === 3 ? 'Harika!' : 'Süper!', t0: now };
    S.busy = false;
    if (S.mask === L.full) win();
  }

  function win() {
    done.add(S.k);
    renderTabs();
    const perfect = S.moves <= S.par;
    $('winTitle').textContent = perfect ? 'Kusursuz!' : 'Bitti!';
    $('winText').textContent = perfect ? `${S.moves} hamle, en iyi çözüm.` : `${S.moves} hamle. En iyi çözüm ${S.par} hamle.`;
    $('next').textContent = S.k + 1 < LEVELS.length ? 'Sonraki bölüm' : 'Baştan oyna';
    const k = S.k;
    setTimeout(() => { if (S.k === k && S.mask === S.L.full) $('win').hidden = false; }, 900);
  }

  // Bırakınca boşluk görünen bir kesişime yakınsa oraya oturur
  function snap(i) {
    const L = S.L, ring = L.rings[i];
    let best = null, bd = 14 * DEG;
    for (const li of L.ringLinks[i]) {
      const k = L.links[li], o = k.a === i ? k.b : k.a;
      if (S.mask & (1 << o) || veiled(o)) continue;
      for (const p of k.pts) {
        const ang = k.a === i ? p.angA : p.angB;
        for (const g of ring.gaps) {
          const t = Logic.norm(ang - g), d = Logic.angDist(t, S.angles[i]);
          if (d < bd) { bd = d; best = t; }
        }
      }
    }
    if (best != null) S.angles = Logic.rotate(L, S.angles, i, Logic.signedDelta(S.angles[i], best));
  }
  function commit() { S.moves++; $('moves').textContent = S.moves; settle(); }

  const toBoard = e => { const b = cv.getBoundingClientRect(); return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height }; };
  cv.addEventListener('pointerdown', e => {
    if (S.busy || !$('win').hidden) return;
    const p = toBoard(e);
    let pick = -1, bd = 26;
    S.L.rings.forEach((r, i) => {
      if (S.mask & (1 << i) || veiled(i)) return;
      const d = Math.abs(Math.hypot(p.x - r.x, p.y - r.y) - r.r);
      if (d < bd) { bd = d; pick = i; }
    });
    if (pick < 0) return;
    const r = S.L.rings[pick];
    S.drag = { ring: pick, last: Math.atan2(p.y - r.y, p.x - r.x), total: 0, base: S.angles.slice() };
    S.hintRing = -1;
    cv.setPointerCapture(e.pointerId);
  });
  cv.addEventListener('pointermove', e => {
    if (!S.drag) return;
    const p = toBoard(e), D = S.drag, r = S.L.rings[D.ring];
    const a = Math.atan2(p.y - r.y, p.x - r.x);
    D.total += Logic.signedDelta(D.last, a); D.last = a;
    S.angles = Logic.rotate(S.L, D.base, D.ring, D.total);
  });
  const release = () => {
    if (!S.drag) return;
    const D = S.drag; S.drag = null;
    if (Math.abs(D.total) < 3 * DEG) { S.angles = D.base; return; }
    snap(D.ring);
    commit();
  };
  cv.addEventListener('pointerup', release);
  cv.addEventListener('pointercancel', release);

  $('reset').onclick = () => { if (!S.busy) load(S.k); };
  $('next').onclick = () => load((S.k + 1) % LEVELS.length);
  $('hint').onclick = async () => {
    if (S.busy || S.mask === S.L.full) return;
    const sol = Logic.solve(S.L, S.angles, S.mask, 200000);
    if (!sol || !sol.first) return;
    S.busy = true; S.hintRing = sol.first.ring;
    await tween(S.angles, Logic.rotate(S.L, S.angles, sol.first.ring, sol.first.delta), 650);
    S.hintRing = -1; S.busy = false;
    commit();
  };

  new ResizeObserver(resize).observe(cv);
  resize();
  load(0);
  requestAnimationFrame(draw);
  window.__proto = { get S() { return S; }, load, hint: () => $('hint').onclick() };
})();
</script>
