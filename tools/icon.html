<!doctype html>
<!-- Uygulama simgesi kaynağı. Tarayıcıda kare pencerede ekran görüntüsü alınarak PNG üretilir.
     ?mode=full (varsayılan) | fg (yalnız halkalar, şeffaf, Android uyarlanabilir simge ön planı)
     | bg (yalnız zemin) | splash (açılış ekranı: zemin + ortada küçük halkalar) -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:transparent}
.bg{position:absolute;inset:0;background:radial-gradient(70% 60% at 25% 15%,#3b3f8f 0%,transparent 70%),linear-gradient(160deg,#272e57,#0f1330)}
svg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.lr{fill:none;stroke-width:30;stroke-linecap:round}
</style></head><body>
<div class="bg" id="bg"></div>
<svg id="rings" viewBox="0 0 512 512">
  <circle cx="196" cy="214" r="102" class="lr" stroke="#ff6b6b" stroke-dasharray="520 121" transform="rotate(-40 196 214)"/>
  <circle cx="316" cy="214" r="102" class="lr" stroke="#ffc94a" stroke-dasharray="520 121" transform="rotate(150 316 214)"/>
  <circle cx="256" cy="312" r="88" class="lr" stroke="#2dd4bf" stroke-dasharray="440 113" transform="rotate(60 256 312)"/>
</svg>
<script>
  const mode = new URLSearchParams(location.search).get('mode') || 'full';
  const rings = document.getElementById('rings');
  // Android ön planı tam boyut: simge aracı güvenli alan için kendisi içeri çeker (inset)
  const size = { full: '100vmin', fg: '100vmin', bg: '0', splash: '34vmin' }[mode];
  rings.style.width = rings.style.height = size;
  if (mode === 'fg') document.getElementById('bg').remove();
  if (mode === 'bg') rings.remove();
</script>
</body></html>
