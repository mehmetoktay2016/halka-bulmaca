<!doctype html>
<!-- Uygulama simgesi kaynağı. PNG üretmek için: tarayıcıda 512x512 ekran görüntüsü alınır. -->
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:512px;height:512px;overflow:hidden}
body{background:radial-gradient(70% 60% at 25% 15%,#3b3f8f 0%,transparent 70%),linear-gradient(160deg,#272e57,#0f1330)}
svg{position:absolute;inset:0;width:512px;height:512px}
.lr{fill:none;stroke-width:30;stroke-linecap:round}
</style></head><body>
<svg viewBox="0 0 512 512">
  <circle cx="196" cy="214" r="102" class="lr" stroke="#ff6b6b" stroke-dasharray="520 121" transform="rotate(-40 196 214)"/>
  <circle cx="316" cy="214" r="102" class="lr" stroke="#ffc94a" stroke-dasharray="520 121" transform="rotate(150 316 214)"/>
  <circle cx="256" cy="312" r="88" class="lr" stroke="#2dd4bf" stroke-dasharray="440 113" transform="rotate(60 256 312)"/>
</svg>
</body></html>
